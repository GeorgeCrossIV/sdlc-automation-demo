name: CI

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: finance-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          VITE_USE_MOCK: 'true'

      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-dist
          path: finance-app/dist/
          retention-days: 7
